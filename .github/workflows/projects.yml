name: Featured projects

# Sinkronkan bagian Featured Projects dengan dims-dev.vercel.app/projects.json (tiap hari, atau klik Run workflow).
on:
  schedule:
    - cron: "0 1 * * *" # 08.00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/projects.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Perbarui featured projects" && git push || echo "Tidak ada perubahan"
